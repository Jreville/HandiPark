services:
  php:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    volumes:
      - ./backend:/var/www/html
      - ./docker/php/php.ini:/usr/local/etc/php/conf.d/custom.ini
    depends_on:
      database:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://handipark:handipark@database:5432/handipark?serverVersion=16&charset=utf8
      APP_ENV: dev
      APP_SECRET: change_me_in_production

  nginx:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./backend:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - php

  database:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: handipark
      POSTGRES_USER: handipark
      POSTGRES_PASSWORD: handipark
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U handipark"]
      interval: 5s
      timeout: 5s
      retries: 5

  adminer:
    image: adminer
    ports:
      - "8081:8080"
    depends_on:
      - database

volumes:
  postgres_data:
